:root{--cw:90px;--ch:120px;--px:1px;--sh:4px;--p:4px;--pf:"m6x11plus","Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b3a20;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--pf);font-weight:400;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
button{font-family:var(--pf)}
#world{position:fixed;inset:0;background:radial-gradient(ellipse 40% 35% at 20% 30%,#52967d,transparent),radial-gradient(ellipse 45% 40% at 78% 55%,#2e6a57,transparent),radial-gradient(ellipse 40% 30% at 45% 85%,#4a8d75,transparent),radial-gradient(ellipse 30% 40% at 90% 10%,#2c6552,transparent),#3b7b66;background-size:140% 140%;animation:sw 30s ease-in-out infinite alternate}
@keyframes sw{to{background-position:100% 100%}}
.slot{position:absolute;background:rgba(0,0,0,.16);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:900;font-size:max(12px,calc(var(--cw)*.17));text-shadow:2px 2px 0 rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
#stage{position:absolute;inset:0;perspective:900px}

.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);transform-style:preserve-3d;pointer-events:none;will-change:transform}
.card>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:0;border-radius:calc(var(--cw)*.09);box-shadow:0 calc(var(--cw)*.03) 0 rgba(0,0,0,.3),0 calc(var(--cw)*.07) calc(var(--cw)*.1) rgba(0,0,0,.25)}
.f{background:#f6f4ec;box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 var(--sh) 0 rgba(0,0,0,.32)!important}
.spr{position:absolute;inset:0;background:var(--sheet) no-repeat;background-size:1300% 400%}
.bk{transform:rotateY(180deg);background:var(--back) center/100% 100% no-repeat;box-shadow:0 var(--sh) 0 rgba(0,0,0,.32)!important}
.card.stk .f{box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 var(--px) 0 #cfc8b4!important}
.card.stk .bk{box-shadow:0 var(--px) 0 #d9d3c1!important}
.card.dim .f{filter:brightness(.68) saturate(.6)}
#status{position:absolute;left:0;right:0;text-align:center;color:#f5edd2;font-weight:900;font-size:max(13px,calc(var(--cw)*.19));text-shadow:2px 2px 0 #000;transform:translateY(-50%);pointer-events:none;padding:0 8px}
#deckinfo{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:900;font-size:max(12px,calc(var(--cw)*.17));text-shadow:2px 2px 0 rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
#btns{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:900;transform:translateY(-50%)}
.btn{--ink:#26262e;--edge:#cfcdc4;--k:2px;position:relative;font:400 max(16px,calc(var(--cw)*.26))/1 var(--pf);font:400 round(max(16px,calc(var(--cw)*.26)),16px)/1 var(--pf);padding:.55em 1.1em;color:var(--ink);background:#f6f4ec;border:0;border-radius:max(6px,calc(var(--cw)*.09));cursor:pointer;text-transform:uppercase;letter-spacing:0;text-shadow:none;margin:var(--p);
box-shadow:inset 0 0 0 var(--px) var(--edge),0 var(--sh) 0 rgba(0,0,0,.32);outline:var(--px) solid rgba(0,0,0,.18);outline:var(--px) solid color-mix(in srgb,var(--ink) 42%,transparent);outline-offset:calc(var(--p)*-1);image-rendering:pixelated;transition:none}
.btn:focus-visible{outline:calc(var(--p)*.5) solid #ffd23f;outline-offset:2px}
.bito{--ink:#c9372a}.take{--ink:#2a5fae}.throw{--ink:#23823f}

.card.tgt .f{outline:calc(var(--p)*1.5) solid #ffd23f;outline-offset:calc(var(--p)*-1.5)}
.btn:hover:not(:disabled){animation:hop .18s steps(3) forwards}
@keyframes hop{0%{transform:translateY(0)}60%{transform:translateY(calc(var(--p)*-1.5))}100%{transform:translateY(calc(var(--p)*-1))}}
.btn:active:not(:disabled){animation:none;transform:translateY(var(--sh));box-shadow:inset 0 0 0 var(--px) var(--edge),0 var(--px) 0 #cfc8b4}
.btn:disabled{filter:brightness(.68) saturate(.6);cursor:default}
#btns .btn{margin:0}
@keyframes vib{0%{transform:translate(0,calc(var(--p)*-.5))}50%{transform:translate(var(--p),calc(var(--p)*-1))}100%{transform:translate(calc(var(--p)*-1),calc(var(--p)*-.5))}}
.pop{position:absolute;z-index:850;pointer-events:none;font-weight:900;font-size:max(22px,calc(var(--cw)*.4));white-space:nowrap;color:#fff;padding:.08em .4em;border-radius:0;text-shadow:2px 2px 0 rgba(0,0,0,.35);animation:pp 1s forwards}
.pop.b{background:#2a62d4;box-shadow:0 .1em 0 #14306e}.pop.k{background:#e2442f;box-shadow:0 .1em 0 #7a1d12}.pop.t{background:#4a8fe0;box-shadow:0 .1em 0 #1c4a8a}
@keyframes pp{0%{transform:translate(-50%,-50%) scale(0) rotate(-22deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.55) rotate(7deg);opacity:1}32%{transform:translate(-50%,-50%) scale(.9) rotate(-4deg)}46%{transform:translate(-50%,-55%) scale(1.12) rotate(2deg)}62%{transform:translate(-50%,-60%) scale(1) rotate(-1deg);opacity:1}100%{transform:translate(-50%,-130%) scale(1);opacity:0}}
#end,#start{position:absolute;inset:0;place-items:center;z-index:1000;background:rgba(0,0,0,.6)}
#end{display:none}#start{display:grid}
#mute{position:absolute;left:calc(6px + var(--p));top:calc(6px + var(--p));z-index:950;width:36px;height:36px;padding:0;font-size:18px;line-height:1;background:#f6f4ec;border:0;border-radius:max(6px,calc(var(--cw)*.09));cursor:pointer;box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 var(--sh) 0 rgba(0,0,0,.32)}
#mute:active{transform:translateY(var(--sh));box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 var(--px) 0 #cfc8b4}
#end div,#start div{background:#f6f4ec;color:#26262e;border:0;border-radius:max(10px,calc(var(--cw)*.14));padding:28px 34px;text-align:center;max-width:90vw;box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 calc(var(--sh)*2) 0 rgba(0,0,0,.32);outline:var(--px) solid rgba(0,0,0,.2);outline-offset:-10px}
#start p{margin:16px 0 0;display:flex;gap:12px;justify-content:center;align-items:center}#start .btn{margin-top:0}.btn.sm{font-size:16px}
#code{font:400 24px/1 var(--pf);text-transform:uppercase;text-align:center;width:5.6ch;padding:.5em .3em;border:0;border-radius:max(6px,calc(var(--cw)*.09));background:#fff;color:#26262e;outline:0;box-shadow:inset 0 0 0 var(--px) #b5ac92,inset 0 var(--sh) 0 rgba(0,0,0,.1);user-select:text;-webkit-user-select:text}
#mpmsg{font-size:16px;min-height:1.2em;max-width:340px;margin:12px auto 0;display:block!important;word-break:break-word}
#end h2,#start h2{margin:0 0 22px;font-size:32px;line-height:1.2;font-weight:400}

/* ================= АДАПТИВНІСТЬ (mobile-first) =================
   база: смартфони 320–767 | ≥768: малі ПК-монітори | ≥1280: ноутбуки | ≥1440: великі монітори */
:root{--maxw:1440px;--gut:0px}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{width:100%;max-width:100%;height:100%;height:100dvh;overflow:hidden;overflow-x:hidden;overscroll-behavior:none}
body{background:#3b7b66}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 40% 35% at 20% 30%,#52967d,transparent),radial-gradient(ellipse 45% 40% at 78% 55%,#2e6a57,transparent),radial-gradient(ellipse 40% 30% at 45% 85%,#4a8d75,transparent),radial-gradient(ellipse 30% 40% at 90% 10%,#2c6552,transparent),#3b7b66;background-size:140% 140%;animation:sw 30s ease-in-out infinite alternate}
#world{background:none!important;animation:none!important;z-index:1}
img,canvas,svg,video{max-width:100%;height:auto}
/* ігрове поле — центрований контейнер; фон сторінки тягнеться на всю ширину */
#world{left:0;right:0;margin-inline:auto;width:min(calc(100% - var(--gut)*2),var(--maxw));top:0;bottom:0;height:auto;overflow:hidden}
/* зручні для пальця кнопки (≥44px) */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;max-width:100%}
#code{min-height:44px}
#mute{width:44px;height:44px;font-size:20px;left:calc(6px + var(--p) + env(safe-area-inset-left,0px));top:calc(6px + var(--p) + env(safe-area-inset-top,0px))}
#btns{gap:clamp(8px,2.5vw,16px);padding:0 8px;flex-wrap:nowrap}
#btns .btn{padding:.5em clamp(.6em,2.4vw,1.1em);white-space:nowrap}
/* стартове меню / екран кінця: один вертикальний стовпчик, не вилазить за екран */
#start div,#end div{width:min(calc(100% - 24px),26rem);max-width:none;padding:clamp(16px,5vw,28px) clamp(14px,5vw,34px);max-height:calc(100% - 24px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:12px}
#start h2,#end h2{font-size:clamp(22px,6.5vw,32px);margin:0 0 4px}
#start p{margin:0;width:100%;flex-wrap:nowrap}
#start #mp2 .btn{flex:1 1 auto;min-width:0}
#start .btn,#end .btn{font-size:max(16px,1rem)}
#code{flex:0 0 auto}
#mpmsg{max-width:100%;margin:0 auto;font-size:clamp(13px,3.6vw,16px);overflow-wrap:anywhere}
#status{padding:0 12px}
/* ---- малі ПК-монітори (768–1279, у т.ч. 1024×768, 1280×1024): компактніше, бічні відступи 20px ---- */
@media (min-width:768px){
  :root{--gut:20px}
  #start div,#end div{display:block;width:auto;max-width:min(90%,30rem);padding:clamp(18px,3vh,28px) 30px}
  #start p{margin:14px 0 0;flex-wrap:wrap}
  #start #mp2 .btn{flex:0 0 auto}
  #start .btn{width:auto}
  #start h2,#end h2{font-size:clamp(26px,3.4vw,32px);margin:0 0 18px}
  #btns{gap:14px}
}
/* ---- ноутбуки (1280–1439): повна десктопна версія, без бічних відступів ---- */
@media (min-width:1280px){
  :root{--gut:0px}
}
/* ---- великі монітори (≥1440): контейнер не ширший за 1440px, по центру ---- */
@media (min-width:1440px){
  :root{--maxw:1440px}
}
/* ---- невисокі екрани (ноутбуки 720–800px заввишки, горизонтальні телефони): меню завжди вміщається ---- */
@media (max-height:800px){
  #start div,#end div{padding-block:14px;gap:8px}
  #start h2,#end h2{margin-bottom:10px;font-size:clamp(20px,4.2vh,30px)}
  #start p{margin-top:10px}
  #mpmsg{font-size:clamp(12px,2.2vh,16px)}
}
@media (max-height:520px){
  #start div,#end div{padding-block:8px}
  #start h2,#end h2{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){#world{animation:none}}

/* на кремовій панелі карта-кнопка окреслена як товста карта */
#start .btn,#end .btn{--edge:#b5ac92;box-shadow:inset 0 0 0 var(--px) var(--edge),0 0 0 var(--px) var(--edge),0 var(--sh) 0 #8f8567}
#start .btn:active:not(:disabled),#end .btn:active:not(:disabled){box-shadow:inset 0 0 0 var(--px) var(--edge),0 0 0 var(--px) var(--edge),0 var(--px) 0 #8f8567}

/* ---- піксельна іконка звуку + панель гучності ---- */
#mute{z-index:1100;display:grid;place-items:center;color:#26262e}
#mute svg,.aic svg{width:36px;height:36px;display:block}
#apanel{position:absolute;z-index:1100;display:none;flex-direction:column;gap:12px;left:calc(6px + var(--p) + env(safe-area-inset-left,0px));top:calc(6px + var(--p) + 44px + 12px + env(safe-area-inset-top,0px));width:min(calc(100% - 24px),270px);padding:16px 14px;background:#f6f4ec;color:#26262e;border-radius:max(8px,calc(var(--cw)*.12));box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 calc(var(--sh)*1.5) 0 rgba(0,0,0,.32);outline:var(--px) solid rgba(0,0,0,.2);outline-offset:-8px}
#apanel.open{display:flex}
.arow{display:flex;align-items:center;gap:10px}
.aic{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;cursor:pointer;color:#26262e;background:#fffdf4;border-radius:max(6px,calc(var(--cw)*.09));box-shadow:inset 0 0 0 var(--px) #b5ac92,0 var(--sh) 0 #8f8567}
.aic:active{transform:translateY(var(--sh));box-shadow:inset 0 0 0 var(--px) #b5ac92,0 var(--px) 0 #8f8567}
.aic.off svg{opacity:.55}
.acol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.acol span{display:flex;justify-content:space-between;font-size:16px;line-height:1;text-transform:uppercase}
.acol b{font-weight:400}
.vol{display:flex;align-items:flex-end;gap:3px;height:24px;cursor:pointer;touch-action:none}
.vol i{flex:1;background:#d8d2bf;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.vol i.on{background:#23823f;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.vol i.on:nth-child(n+7){background:#d9a521}
.vol i.on:nth-child(n+9){background:#c9372a}
.vol.m i.on{background:#a8a28d!important}
.vol:focus-visible{outline:2px solid #ffd23f;outline-offset:3px}

/* ---- Таро ---- */
#tslot{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));bottom:8px;z-index:880;display:none;flex-direction:column;align-items:center;gap:6px}
#tcard{position:relative;width:calc(var(--cw)*.82);height:calc(var(--ch)*.82);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px;text-align:center;color:#f5edd2;background:#2b1b4a;border-radius:calc(var(--cw)*.08);box-shadow:inset 0 0 0 var(--px) #e8c35a,0 var(--sh) 0 rgba(0,0,0,.32);outline:var(--px) solid rgba(232,195,90,.45);outline-offset:calc(var(--p)*-1.5);cursor:pointer}
#trow{display:flex;align-items:flex-end;gap:12px}
#tcard.empty{background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 var(--px) rgba(255,255,255,.25);color:rgba(255,255,255,.5);outline:0}
#tcard i{font-style:normal;color:#e8c35a;font-size:14px;line-height:1}
#tcard b{font-weight:400;font-size:max(13px,calc(var(--cw)*.15));line-height:1.05;padding-bottom:4px}
#tslot .btn{font-size:14px;min-height:36px}
#tfx{max-width:calc(var(--cw)*2.2);text-align:center;color:#ffd23f;font-size:13px;line-height:1.1;text-shadow:2px 2px 0 #000}
#tdesc{position:absolute;left:calc(100% + 8px);bottom:0;width:min(230px,52vw);display:none;padding:8px 10px;color:#26262e;background:#f6f4ec;font-size:14px;line-height:1.2;border-radius:6px;box-shadow:0 var(--sh) 0 rgba(0,0,0,.32)}
#tdesc{position:absolute;z-index:990;pointer-events:none;box-sizing:border-box;text-align:left}
#tdesc.show{display:block}
#tdesc b{font-weight:400;color:#8a71e1;margin-right:6px}
.card.ench .f{outline:calc(var(--p)*1.5) solid #b36bff;outline-offset:calc(var(--p)*-1.5)}
.card.rev .f{outline:var(--p) solid #5ec8ff;outline-offset:calc(var(--p)*-1)}
.modal-overlay{position:absolute;inset:0;z-index:1050;display:none;place-items:center;background:rgba(0,0,0,.6)}
.modal-overlay>div{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:94%;padding:18px 20px;text-align:center;background:#f6f4ec;color:#26262e;border-radius:max(10px,calc(var(--cw)*.14));box-shadow:inset 0 0 0 var(--px) #cfcdc4,0 calc(var(--sh)*2) 0 rgba(0,0,0,.32)}
.modal-overlay h2{margin:0;font-size:clamp(18px,4.5vw,26px);font-weight:400;line-height:1.2}
#tmCards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:100%}
.mc{position:relative;flex:none;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.09);cursor:pointer;overflow:hidden}
.mc.dim{filter:brightness(.55) saturate(.6);cursor:default}
.mc:not(.dim):hover{transform:translateY(-4px)}
#tbanner{position:absolute;left:50%;top:calc(var(--ch)*.1);transform:translateX(-50%);z-index:960;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;max-width:94%;padding:8px 12px;background:rgba(0,0,0,.72);color:#f5edd2;font-size:16px;line-height:1.1;text-shadow:2px 2px 0 #000}

#tcard{display:none!important}
#tslot{align-items:flex-start}
#tdesc{left:0;bottom:calc(100% + 8px)}
